name: desktop

description: "Dhandas - Modern Accounting and Business Management Software"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  http: ^1.2.2
  excel: ^4.0.3

  # iOS-style icons. Safe to keep for cross-platform compatibility.
  cupertino_icons: ^1.0.8
  printing: ^5.14.3
  pdf: ^3.12.0

  # --- Local DB / sync stack ---
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # -------------------------------------------------------
  # Dhandas UI Images
  # -------------------------------------------------------
  assets:
    - assets/images/
    - lib/api/helpers/hsn.json